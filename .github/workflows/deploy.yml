# Workflow de deploy para GitHub Pages (React + Vite)
#
# O build roda automaticamente a cada push na branch main (ou manualmente
# pela aba "Actions" -> "Deploy site (Vite) to GitHub Pages" -> Run workflow).
#
# PRÉ-REQUISITO (uma vez por repositório):
#   GitHub > Repositório > Settings > Pages > Source = "GitHub Actions"

name: Deploy site (Vite) to GitHub Pages

on:
  push:
    branches: ["main", "plataforma-educativa-ia"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
