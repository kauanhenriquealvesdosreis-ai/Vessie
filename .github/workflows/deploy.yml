# Workflow único de deploy para GitHub Pages (Vite + React)
#
# Substitui os dois workflows conflitantes que vieram no projeto:
#   - jekyll-gh-pages.yml  (builda como site Jekyll -> não builda o Vite)
#   - static.yml           (só copia os arquivos como estão -> não builda o Vite)
#
# COMO USAR:
# 1. Este arquivo já está configurado corretamente para o projeto na raiz
# 2. No GitHub: Settings > Pages > Source = "GitHub Actions"
# 3. Para usar no Figma, importe este projeto através do Make

name: Deploy site (Vite) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
