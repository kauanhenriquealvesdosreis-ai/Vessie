# Workflow único de deploy para GitHub Pages (Vite + React)
#
# Substitui os dois workflows conflitantes que vieram no projeto:
#   - jekyll-gh-pages.yml  (builda como site Jekyll -> não builda o Vite)
#   - static.yml           (só copia os arquivos como estão -> não builda o Vite)
#
# COMO USAR:
# 1. Apague os dois arquivos antigos em .github/workflows/
# 2. Coloque este arquivo em .github/workflows/deploy.yml
# 3. Ajuste a linha "working-directory" abaixo se o seu package.json
#    estiver dentro de uma subpasta (ex: "backend"). Se o package.json
#    estiver na raiz do repositório, apague as linhas "working-directory".
# 4. No GitHub: Settings > Pages > Source = "GitHub Actions"

name: Deploy site (Vite) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # ATENÇÃO: troque "backend" pelo nome da pasta que contém o
        # package.json do seu projeto Vite. Se o package.json estiver
        # na raiz do repo, apague esta seção "defaults".
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
